[project]
name = "ashare-trading-assistant"
version = "0.1.0"
description = "A-share personal trading assistant: data foundation and dual-template planning pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1,<2",
  "polars>=0.20,<2",
  "pyarrow>=16,<20",
  "duckdb>=1.0,<2",
  "tushare>=1.4,<2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<14",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
