[project]
name = "ashare-trading-assistant"
version = "0.1.0"
description = "A-share personal trading assistant: data foundation and dual-template planning pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1,<2",
  "polars>=0.20,<2",
  "pyarrow>=16,<20",
  "duckdb>=1.0,<2",
  "tushare>=1.4,<2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<14",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9,<1",
  "pwdlib[argon2]>=0.2,<1",
  "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Polars row values are typed as Any; the strategies validate them at runtime.
module = ["app.strategies.*", "app.planning.strategy_planner"]
disable_error_code = ["arg-type"]

[tool.ruff.lint.per-file-ignores]
# FastAPI/Typer declare parameters as callables in defaults.
"app/api/app.py" = ["B008"]
"app/cli.py" = ["B008"]
